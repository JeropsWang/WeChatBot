name: Verify
on:
  push:
    branches: [main, linuo]
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: liino
          POSTGRES_PASSWORD: liino_local
          POSTGRES_DB: liino_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U liino" --health-interval 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['63799:6379']
    env:
      TEST_DATABASE_URL: postgres://liino:liino_local@127.0.0.1:5432/liino_test
      REDIS_URL: redis://127.0.0.1:63799
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: npm ci
      - run: npm --prefix apps/web ci
      - run: npm run build
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run test:sites
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 图库输入校验使用真实 Pillow；不安装 torch、不下载模型权重。
      - run: python -m venv .venv-image-match
      - run: .venv-image-match/bin/python -m pip install pillow==13.0.0
      - run: npm test
  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/Scripts/python.exe -m pip install -r bridge/requirements.lock.txt
      - run: npm run test:bridge
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
