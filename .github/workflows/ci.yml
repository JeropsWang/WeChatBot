name: Verify
on:
  push:
    branches: [main, linuo]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: liino
          POSTGRES_PASSWORD: liino_local
          POSTGRES_DB: liino_test
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U liino" --health-interval 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ['63799:6379']
    env:
      TEST_DATABASE_URL: postgres://liino:liino_local@127.0.0.1:5432/liino_test
      REDIS_URL: redis://127.0.0.1:63799
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: npm ci
      - run: npm --prefix apps/web ci
      - run: npm run build
      - run: npm --prefix apps/web run typecheck
      - run: npm --prefix apps/web run test:sites
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # 附件解码/转盘使用核心环境，图库使用独立图像环境；均真实执行 Pillow。
      # 不安装 Windows 桌面桥接、torch 或模型权重，CI 不启动微信。
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install pillow==13.0.0
      - run: python -m venv .venv-image-match
      - run: .venv-image-match/bin/python -m pip install pillow==13.0.0
      - run: npm test
  bridge:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/Scripts/python.exe -m pip install -r bridge/requirements.lock.txt
      - run: npm run test:bridge
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 扫描全部可达历史，避免首次 push 没有父提交时第三方包装器生成无效区间。
      - name: Scan complete history with verified Gitleaks
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksums="gitleaks_${version}_checksums.txt"
          curl --retry 3 -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${archive}"
          curl --retry 3 -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${version}/${checksums}"
          sha256sum --check --ignore-missing "$checksums"
          tar -xzf "$archive" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --log-opts=--all
